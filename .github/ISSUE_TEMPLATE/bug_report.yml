name: Bug report
description: Report reproducible software or hardware-control behaviour
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private IP addresses, Bluetooth identifiers, personal paths, or unsanitized logs."
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Simulation, Vicon-only, Single robot, Multi-robot]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      render: shell
