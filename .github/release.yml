changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "Security"
      labels:
        - security
    - title: "Features"
      labels:
        - enhancement
        - feature
    - title: "Fixes"
      labels:
        - bug
    - title: "Documentation"
      labels:
        - documentation
    - title: "Maintenance"
      labels:
        - dependencies
        - ci
    - title: "Other changes"
      labels:
        - "*"
