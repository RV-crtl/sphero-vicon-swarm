name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python sources and public entry points
        run: python -m compileall -q src examples reference_controllers tools

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Type-check reusable package
        run: mypy src/sphero_vicon_swarm

      - name: Run tests with coverage
        run: pytest --cov=sphero_vicon_swarm --cov-report=term-missing --cov-report=xml

      - name: Run privacy scan
        run: python tools/privacy_scan.py .

      - name: Exercise reference controller dry-run
        run: python reference_controllers/three_chariot_square_swarm.py --dry-run --timeout 2 --no-digital-twin

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify installed package
        run: |
          python -m pip check
          python -m sphero_vicon_swarm doctor

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  required-ci:
    name: Required CI
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.package.result }}" != "success" ]; then
            echo "One or more required CI jobs failed." >&2
            echo "test=${{ needs.test.result }} package=${{ needs.package.result }}" >&2
            exit 1
          fi
          echo "All required CI jobs passed."
