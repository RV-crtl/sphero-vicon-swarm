name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: GitHub dependency review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v5

      - name: Explain unavailable native dependency review
        if: steps.dependency-review.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::GitHub's native Dependency Review is unavailable for this repository."
          echo "This usually means the repository Dependency Graph is not yet enabled or indexed."
          echo "The workflow stays non-blocking until GitHub makes the native review service available."

      - name: Install Python dependency auditor
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit declared project dependencies
        run: pip-audit . --strict --progress-spinner off
