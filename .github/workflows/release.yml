name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    name: build-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade pip build pytest pip-audit

      - name: Run release checks
        run: python tools/release_check.py

      - name: Audit runtime dependencies
        run: pip-audit . --strict --progress-spinner off

      - name: Build distributions
        run: python -m build

      - name: Install built wheel and verify metadata
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -m sphero_vicon_swarm doctor

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Generate SHA-256 manifest
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*
