name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade pip build pytest pip-audit

      - name: Run release checks
        run: python tools/release_check.py

      - name: Audit runtime dependencies
        run: pip-audit . --strict --progress-spinner off

      - name: Build distributions
        run: python -m build

      - name: Install built wheel and verify metadata
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -m sphero_vicon_swarm doctor

      - name: Generate SHA-256 manifest
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
