name: Secret Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "41 2 * * 3"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Project-specific privacy scan
        run: python tools/privacy_scan.py .
