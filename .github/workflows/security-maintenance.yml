name: Security Maintenance

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/security-maintenance.yml"
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all public optional dependency groups
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,sphero]" pip-audit

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: pip-audit --local --strict --progress-spinner off --skip-editable

      - name: Run repository privacy scan
        run: python tools/privacy_scan.py .
