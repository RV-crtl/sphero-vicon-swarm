
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Vicon Tracker calibration workflow</title><desc id="d">High resolution vector showing masking, wand wave, image error review and origin setting.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#4fc9ff"/><stop offset="1" stop-color="#786dff"/></linearGradient></defs>
<rect width="1600" height="900" rx="28" fill="#09111d"/>
<text x="62" y="78" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800">Camera Calibration</text>
<text x="62" y="114" fill="#93a6bf" font-family="Inter,Segoe UI,sans-serif" font-size="19">A clean, version-neutral map of the Tracker 4.x calibration sequence</text>
<g font-family="Inter,Segoe UI,sans-serif">
  <g transform="translate(70 170)">
    <rect width="330" height="570" rx="22" fill="#141f30" stroke="#2c3c54"/>
    <circle cx="56" cy="56" r="28" fill="#1e3a52"/><text x="56" y="66" text-anchor="middle" fill="#6bd5ff" font-size="28" font-weight="800">1</text>
    <text x="100" y="52" fill="#eef6ff" font-size="25" font-weight="800">Masking</text>
    <text x="100" y="81" fill="#99aac0" font-size="16">remove false reflections</text>
    <rect x="30" y="120" width="270" height="110" rx="14" fill="#0c1421"/>
    <g fill="#315a7d"><circle cx="72" cy="158" r="7"/><circle cx="126" cy="183" r="6"/><circle cx="190" cy="153" r="5"/><circle cx="244" cy="191" r="7"/></g>
    <rect x="58" y="265" width="214" height="56" rx="12" fill="#20364e" stroke="#4fc9ff"/><text x="165" y="300" text-anchor="middle" fill="#eaf8ff" font-size="20" font-weight="700">Mask All</text>
    <text x="35" y="360" fill="#9aacbf" font-size="17">✓ remove/cover reflectors</text><text x="35" y="392" fill="#9aacbf" font-size="17">✓ inspect every camera</text><text x="35" y="424" fill="#9aacbf" font-size="17">✓ stop when masks settle</text>
  </g>
  <g transform="translate(445 170)">
    <rect width="330" height="570" rx="22" fill="#141f30" stroke="#2c3c54"/>
    <circle cx="56" cy="56" r="28" fill="#2a2d58"/><text x="56" y="66" text-anchor="middle" fill="#8d83ff" font-size="28" font-weight="800">2</text>
    <text x="100" y="52" fill="#eef6ff" font-size="25" font-weight="800">Wand Wave</text><text x="100" y="81" fill="#99aac0" font-size="16">cover depth + height</text>
    <rect x="30" y="120" width="270" height="145" rx="14" fill="#0c1421"/>
    <path d="M64 222C110 140 168 250 250 152" fill="none" stroke="url(#g)" stroke-width="5"/>
    <g fill="#eef6ff"><circle cx="74" cy="207" r="6"/><circle cx="128" cy="168" r="6"/><circle cx="184" cy="213" r="6"/><circle cx="240" cy="164" r="6"/></g>
    <rect x="58" y="295" width="214" height="56" rx="12" fill="#273052" stroke="#786dff"/><text x="165" y="330" text-anchor="middle" fill="#f1efff" font-size="20" font-weight="700">Wave All</text>
    <text x="35" y="390" fill="#9aacbf" font-size="17">✓ correct wand selected</text><text x="35" y="422" fill="#9aacbf" font-size="17">✓ Auto Stop enabled</text><text x="35" y="454" fill="#9aacbf" font-size="17">✓ low-count cameras covered</text>
  </g>
  <g transform="translate(820 170)">
    <rect width="330" height="570" rx="22" fill="#141f30" stroke="#2c3c54"/>
    <circle cx="56" cy="56" r="28" fill="#4b3a25"/><text x="56" y="66" text-anchor="middle" fill="#ffd27a" font-size="28" font-weight="800">3</text>
    <text x="100" y="52" fill="#eef6ff" font-size="25" font-weight="800">Review</text><text x="100" y="81" fill="#99aac0" font-size="16">count + image error</text>
    <rect x="30" y="126" width="270" height="206" rx="14" fill="#0c1421"/>
    <g font-size="14" fill="#9db0c8"><text x="50" y="160">Camera</text><text x="152" y="160">Count</text><text x="226" y="160">Error</text></g>
    <g font-size="16"><text x="50" y="198" fill="#eaf3ff">Cam 01</text><text x="160" y="198" fill="#8ef0b9">3488</text><text x="235" y="198" fill="#8ef0b9">0.18</text><text x="50" y="232" fill="#eaf3ff">Cam 02</text><text x="160" y="232" fill="#8ef0b9">3212</text><text x="235" y="232" fill="#ffd27a">0.42</text><text x="50" y="266" fill="#eaf3ff">Cam 03</text><text x="160" y="266" fill="#ffd27a">2280</text><text x="235" y="266" fill="#8ef0b9">0.21</text></g>
    <text x="35" y="380" fill="#9aacbf" font-size="17">✓ inspect image error</text><text x="35" y="412" fill="#9aacbf" font-size="17">✓ investigate weak cameras</text><text x="35" y="444" fill="#9aacbf" font-size="17">✓ repeat only if needed</text>
  </g>
  <g transform="translate(1195 170)">
    <rect width="330" height="570" rx="22" fill="#141f30" stroke="#2c3c54"/>
    <circle cx="56" cy="56" r="28" fill="#21453d"/><text x="56" y="66" text-anchor="middle" fill="#86f2cf" font-size="28" font-weight="800">4</text>
    <text x="100" y="52" fill="#eef6ff" font-size="25" font-weight="800">Volume Setup</text><text x="100" y="81" fill="#99aac0" font-size="16">set the world origin</text>
    <rect x="30" y="120" width="270" height="190" rx="14" fill="#0c1421"/>
    <path d="M165 214L244 214" stroke="#ff5d5d" stroke-width="5"/><path d="M165 214L165 137" stroke="#5bd179" stroke-width="5"/><path d="M165 214L108 261" stroke="#5da9ff" stroke-width="5"/>
    <circle cx="165" cy="214" r="9" fill="#fff"/>
    <rect x="54" y="340" width="222" height="56" rx="12" fill="#1f3d38" stroke="#62d9b1"/><text x="165" y="375" text-anchor="middle" fill="#eafff8" font-size="19" font-weight="700">Start Set Origin</text>
    <text x="35" y="438" fill="#9aacbf" font-size="17">✓ place device physically</text><text x="35" y="470" fill="#9aacbf" font-size="17">✓ verify X / Y / Z</text><text x="35" y="502" fill="#9aacbf" font-size="17">✓ floor plane if required</text>
  </g>
</g>
<path d="M400 455H437M775 455H812M1150 455H1187" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
<text x="800" y="835" text-anchor="middle" fill="#8194ad" font-family="Inter,Segoe UI,sans-serif" font-size="18">Tracker 4.x workflow map • use your installed version's official help for exact control placement</text>
</svg>
