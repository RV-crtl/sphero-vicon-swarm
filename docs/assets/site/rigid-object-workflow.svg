
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Rigid object creation workflow</title><desc id="d">Vector illustration of selecting an asymmetric marker cluster, naming it, creating the object, and verifying motion.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#4fc9ff"/><stop offset="1" stop-color="#7a6eff"/></linearGradient></defs>
<rect width="1600" height="900" rx="28" fill="#09111d"/>
<text x="64" y="78" fill="#f7fbff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800">Rigid-object creation</text>
<text x="64" y="115" fill="#91a5be" font-family="Inter,Segoe UI,sans-serif" font-size="19">Select an asymmetric marker cluster, create the object, then verify physical identity</text>
<rect x="60" y="160" width="1010" height="650" rx="22" fill="#0d1624" stroke="#2d3d53"/>
<g stroke="#26354a" stroke-width="2"><path d="M130 738L565 360L1005 738"/><path d="M130 738H1005"/><path d="M255 630H880"/><path d="M370 530H765"/><path d="M475 440H660"/></g>
<g stroke="#314358" stroke-width="3" opacity=".75"><path d="M160 210L565 360M960 210L565 360M130 710L565 360M1000 700L565 360"/></g>
<rect x="430" y="310" width="255" height="188" rx="18" fill="#16283c" fill-opacity=".72" stroke="#4fc9ff" stroke-width="4"/>
<g fill="#f4f7fb"><circle cx="490" cy="370" r="12"/><circle cx="590" cy="345" r="11"/><circle cx="634" cy="410" r="10"/><circle cx="522" cy="441" r="9"/><circle cx="563" cy="397" r="8"/></g>
<text x="556" y="535" text-anchor="middle" fill="#6dd8ff" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">5 selected markers</text>
<rect x="1110" y="160" width="430" height="650" rx="22" fill="#141f30" stroke="#2d3d53"/>
<text x="1140" y="205" fill="#eff6ff" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="800">Tracking panel</text>
<text x="1140" y="250" fill="#92a6bf" font-family="Inter,Segoe UI,sans-serif" font-size="16">Object name</text>
<rect x="1140" y="268" width="370" height="56" rx="11" fill="#0d1624" stroke="#4b607a"/><text x="1162" y="304" fill="#e9f2ff" font-family="Inter,Segoe UI,sans-serif" font-size="20">robot-1</text>
<rect x="1140" y="348" width="178" height="58" rx="12" fill="url(#g)"/><text x="1229" y="384" text-anchor="middle" fill="#07101c" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="800">Create</text>
<rect x="1332" y="348" width="178" height="58" rx="12" fill="#203047"/><text x="1421" y="384" text-anchor="middle" fill="#aebed3" font-family="Inter,Segoe UI,sans-serif" font-size="18">Add Marker</text>
<g font-family="Inter,Segoe UI,sans-serif">
<text x="1140" y="462" fill="#f3f7fc" font-size="20" font-weight="700">Verification</text>
<text x="1140" y="505" fill="#9cafc4" font-size="17">1. move the physical chariot</text>
<text x="1140" y="541" fill="#9cafc4" font-size="17">2. confirm only this object moves</text>
<text x="1140" y="577" fill="#9cafc4" font-size="17">3. record subject + segment names</text>
<text x="1140" y="613" fill="#9cafc4" font-size="17">4. never infer identity by list order</text>
</g>
<rect x="1140" y="665" width="370" height="92" rx="14" fill="#15342e" stroke="#3bcf9a"/><circle cx="1170" cy="711" r="9" fill="#5ce0b0"/><text x="1192" y="704" fill="#e8fff7" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Identity verified</text><text x="1192" y="732" fill="#9ed9c6" font-family="Inter,Segoe UI,sans-serif" font-size="15">ready for DataStream mapping</text>
