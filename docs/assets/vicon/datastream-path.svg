<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="760" viewBox="0 0 1550 760">
<defs><style>
.bg{fill:#17191d}.box{fill:#282c32;stroke:#727984;stroke-width:2}.main{fill:#315c35;stroke:#72d14c;stroke-width:3}.opt{fill:#3a3a3a;stroke:#888;stroke-width:2;stroke-dasharray:10 8}.txt{font-family:Arial,sans-serif;fill:#f4f4f4}.med{font-size:28px;font-weight:700}.small{font-size:23px}.arrow{stroke:#72d14c;stroke-width:7;fill:none;marker-end:url(#a)}.grey{stroke:#999;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#g)}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#72d14c"/></marker>
<marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#999"/></marker></defs>
<rect width="1550" height="760" class="bg"/>
<text x="50" y="60" class="txt med">Data path used by sphero-vicon-swarm</text>
<rect x="60" y="150" width="230" height="120" rx="14" class="main"/><text x="115" y="205" class="txt med">Tracker 4.x</text><text x="92" y="240" class="txt small">tracked objects</text>
<rect x="360" y="150" width="250" height="120" rx="14" class="main"/><text x="405" y="202" class="txt med">DataStream</text><text x="397" y="240" class="txt small">TCP, default :801</text>
<rect x="680" y="150" width="250" height="120" rx="14" class="main"/><text x="720" y="202" class="txt med">vicon_dssdk</text><text x="705" y="240" class="txt small">Python client</text>
<rect x="1000" y="150" width="250" height="120" rx="14" class="main"/><text x="1040" y="202" class="txt med">ViconTracker</text><text x="1030" y="240" class="txt small">repo adapter</text>
<rect x="1310" y="150" width="190" height="120" rx="14" class="main"/><text x="1355" y="202" class="txt med">Pose2D</text><text x="1340" y="240" class="txt small">x, y, yaw, occ</text>
<path d="M290 210 L360 210" class="arrow"/><path d="M610 210 L680 210" class="arrow"/><path d="M930 210 L1000 210" class="arrow"/><path d="M1250 210 L1310 210" class="arrow"/>
<rect x="390" y="420" width="250" height="120" rx="14" class="opt"/><text x="465" y="470" class="txt med">UDP</text><text x="415" y="510" class="txt small">optional fallback path</text>
<path d="M180 270 C180 480 300 480 390 480" class="grey"/>
<text x="690" y="455" class="txt med">Important</text>
<text x="690" y="500" class="txt small">This repository uses the DataStream SDK path above.</text>
<text x="690" y="540" class="txt small">You do not need to enable UDP Object Stream for the swarm.</text>
<text x="690" y="580" class="txt small">Use View → Connections to confirm the DataStream client appears.</text>
<text x="690" y="620" class="txt small">Then verify object names and live pose with examples/03_vicon_pose_monitor.py.</text>
</svg>