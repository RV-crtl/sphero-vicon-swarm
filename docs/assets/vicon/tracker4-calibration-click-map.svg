<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<defs><style>
.bg{fill:#181a1e}.panel{fill:#272a30;stroke:#4f555e;stroke-width:2}.sec{fill:#343840}.btn{fill:#555b64;stroke:#8c939d;stroke-width:2}.active{fill:#59c94e}.txt{font-family:Arial,sans-serif;fill:#f6f6f6}.small{font-size:24px}.med{font-size:31px;font-weight:700}.call{fill:#ffd400;stroke:#111;stroke-width:3}.num{font-size:27px;font-weight:700;fill:#111}.line{stroke:#ffd400;stroke-width:5;fill:none}
</style></defs>
<rect width="1500" height="1000" class="bg"/>
<text x="45" y="58" class="txt med">Tracker 4.x Camera Calibration — click map</text>
<rect x="80" y="100" width="650" height="800" rx="10" class="panel"/>
<text x="110" y="150" class="txt med">Camera Calibration</text>
<rect x="110" y="180" width="590" height="120" rx="8" class="sec"/>
<text x="135" y="220" class="txt med">Masking</text>
<rect x="135" y="245" width="220" height="42" rx="6" class="btn"/><text x="165" y="274" class="txt small">Auto Mask / Start</text>
<rect x="110" y="325" width="590" height="180" rx="8" class="sec"/>
<text x="135" y="365" class="txt med">Wand Wave</text>
<text x="135" y="405" class="txt small">Wand: Active Wand v2</text>
<rect x="135" y="430" width="180" height="48" rx="6" class="active"/><text x="175" y="463" class="txt small">Wave All</text>
<rect x="110" y="530" width="590" height="220" rx="8" class="sec"/>
<text x="135" y="570" class="txt med">Volume Setup</text>
<text x="135" y="610" class="txt small">Set Volume Origin</text>
<rect x="135" y="635" width="220" height="48" rx="6" class="btn"/><text x="158" y="668" class="txt small">Start Set Origin</text>
<rect x="380" y="635" width="190" height="48" rx="6" class="active"/><text x="420" y="668" class="txt small">Set Origin</text>
<rect x="110" y="775" width="590" height="95" rx="8" class="sec"/>
<text x="135" y="815" class="txt med">Manage Camera Calibration</text>
<rect x="505" y="825" width="150" height="36" rx="6" class="btn"/><text x="553" y="851" class="txt small">Save</text>
<text x="820" y="145" class="txt med">Sequence</text>
<text x="850" y="205" class="txt small">1  Remove/cover reflections first.</text>
<text x="850" y="245" class="txt small">2  Mask only persistent reflections.</text>
<text x="850" y="285" class="txt small">3  Select the correct wand.</text>
<text x="850" y="325" class="txt small">4  Click Wave All and cover the full volume.</text>
<text x="850" y="365" class="txt small">5  Set the world origin / floor frame.</text>
<text x="850" y="405" class="txt small">6  Validate health and save the calibration.</text>
<text x="820" y="500" class="txt med">Do not accept calibration by appearance alone</text>
<text x="850" y="550" class="txt small">Check System Health Report:</text>
<text x="880" y="590" class="txt small">• enabled cameras calibrated</text>
<text x="880" y="630" class="txt small">• sensible Centroid Connectivity</text>
<text x="880" y="670" class="txt small">• low/stable Image Error</text>
<text x="880" y="710" class="txt small">• no bumped/moved-camera warning</text>
<circle cx="88" cy="230" r="23" class="call"/><text x="80" y="240" class="num">1</text><path d="M111 230 L135 260" class="line"/>
<circle cx="88" cy="395" r="23" class="call"/><text x="80" y="405" class="num">2</text><path d="M111 395 L135 450" class="line"/>
<circle cx="88" cy="655" r="23" class="call"/><text x="80" y="665" class="num">3</text><path d="M111 655 L135 655" class="line"/>
<circle cx="88" cy="830" r="23" class="call"/><text x="80" y="840" class="num">4</text><path d="M111 830 L505 842" class="line"/>
<text x="80" y="945" class="txt small">Schematic guide based on Tracker 4.x control names; exact panel placement can vary with saved layouts and minor versions.</text>
</svg>