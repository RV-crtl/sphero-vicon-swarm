<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs><style>
.bg{fill:#181a1e}.panel{fill:#272a30;stroke:#4f555e;stroke-width:2}.sec{fill:#343840}.btn{fill:#555b64;stroke:#8c939d;stroke-width:2}.active{fill:#59c94e}.txt{font-family:Arial,sans-serif;fill:#f6f6f6}.small{font-size:24px}.med{font-size:31px;font-weight:700}.marker{fill:#ce62ff;stroke:#f0c8ff;stroke-width:3}.sel{fill:#ffd400;stroke:#fff;stroke-width:3}.call{fill:#ffd400;stroke:#111;stroke-width:3}.num{font-size:27px;font-weight:700;fill:#111}.line{stroke:#ffd400;stroke-width:5;fill:none}
</style></defs>
<rect width="1500" height="980" class="bg"/>
<text x="45" y="58" class="txt med">Tracker 4.x — create and verify a rigid object</text>
<rect x="55" y="100" width="470" height="780" rx="10" class="panel"/>
<text x="85" y="148" class="txt med">Tracking panel</text>
<rect x="85" y="175" width="410" height="230" rx="8" class="sec"/>
<text x="105" y="215" class="txt med">Setup</text>
<text x="105" y="258" class="txt small">Object</text>
<rect x="190" y="225" width="190" height="46" rx="5" class="btn"/><text x="205" y="256" class="txt small">Robot_1</text>
<rect x="390" y="225" width="90" height="46" rx="5" class="active"/><text x="408" y="256" class="txt small">Create</text>
<text x="105" y="315" class="txt small">Modify Object</text>
<rect x="105" y="335" width="160" height="42" rx="5" class="btn"/><text x="120" y="364" class="txt small">Add Marker</text>
<rect x="285" y="335" width="190" height="42" rx="5" class="btn"/><text x="300" y="364" class="txt small">Remove Marker</text>
<rect x="85" y="430" width="410" height="180" rx="8" class="sec"/>
<text x="105" y="470" class="txt med">Objects</text>
<text x="125" y="520" class="txt small">✓ Robot_1</text>
<text x="125" y="560" class="txt small">✓ Robot_2</text>
<rect x="555" y="100" width="890" height="780" rx="10" class="panel"/>
<text x="585" y="148" class="txt med">3D View</text>
<path d="M650 775 L965 265 L1335 775 Z" fill="#101214" stroke="#6f757d" stroke-width="3"/>
<circle cx="980" cy="495" r="13" class="sel"/><circle cx="1035" cy="465" r="13" class="sel"/><circle cx="1070" cy="525" r="13" class="sel"/><circle cx="925" cy="545" r="13" class="sel"/><circle cx="1030" cy="570" r="13" class="sel"/>
<circle cx="760" cy="430" r="10" class="marker"/><circle cx="1240" cy="620" r="10" class="marker"/>
<text x="910" y="630" class="txt small">selected markers → new rigid object</text>
