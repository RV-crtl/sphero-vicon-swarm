<circle cx="460" cy="245" r="23" class="call"/><text x="452" y="255" class="num">2</text><path d="M437 245 L380 245" class="line"/>
<circle cx="500" cy="360" r="23" class="call"/><text x="492" y="370" class="num">3</text><path d="M477 360 L265 357" class="line"/>
<circle cx="540" cy="520" r="23" class="call"/><text x="532" y="530" class="num">4</text><path d="M517 520 L260 520" class="line"/>
<text x="80" y="925" class="txt small">1 select ≥4 unassigned markers (5+ recommended) • 2 type a unique object name + Create • 3 adjust markers if needed • 4 enable and verify one object at a time</text>
</svg>