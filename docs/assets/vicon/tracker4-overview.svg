<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
.bg{fill:#191b1f}.panel{fill:#25282d;stroke:#4b5058;stroke-width:2}.bar{fill:#30343a}.accent{fill:#72d14c}.txt{font-family:Arial,sans-serif;fill:#f4f4f4}.small{font-size:24px}.med{font-size:30px;font-weight:700}.num{font-size:28px;font-weight:700;fill:#111}.call{fill:#ffd400;stroke:#111;stroke-width:3}.line{stroke:#ffd400;stroke-width:6;fill:none}.dim{fill:#aeb4bc}.good{fill:#75d65b}.warn{fill:#f4d34b}
</style></defs>
<rect width="1600" height="900" class="bg"/>
<rect x="0" y="0" width="1600" height="65" class="bar"/>
<text x="24" y="42" class="txt med">Vicon Tracker 4.x — orientation map for this project</text>
<rect x="20" y="90" width="360" height="720" class="panel"/>
<rect x="400" y="90" width="820" height="720" class="panel"/>
<rect x="1240" y="90" width="340" height="720" class="panel"/>
<text x="42" y="130" class="txt med">Left-side panels</text>
<rect x="42" y="155" width="300" height="58" rx="8" class="bar"/><text x="62" y="194" class="txt small">System</text>
<rect x="42" y="225" width="300" height="58" rx="8" class="bar"/><text x="62" y="264" class="txt small">Camera Calibration</text>
<rect x="42" y="295" width="300" height="58" rx="8" class="bar"/><text x="62" y="334" class="txt small">Tracking</text>
<rect x="42" y="365" width="300" height="58" rx="8" class="bar"/><text x="62" y="404" class="txt small">Processing</text>
<rect x="42" y="435" width="300" height="58" rx="8" class="bar"/><text x="62" y="474" class="txt small">Connections</text>
<text x="430" y="130" class="txt med">Workspace / 3D View</text>
<path d="M520 690 L810 280 L1110 690 Z" fill="#101214" stroke="#80858c" stroke-width="3"/>
<line x1="815" y1="310" x2="815" y2="690" stroke="#4a5057" stroke-width="2"/>
<line x1="640" y1="505" x2="995" y2="505" stroke="#4a5057" stroke-width="2"/>
<circle cx="810" cy="490" r="9" class="accent"/><circle cx="840" cy="470" r="9" class="accent"/><circle cx="850" cy="510" r="9" class="accent"/><circle cx="785" cy="520" r="9" class="accent"/>
<text x="760" y="555" class="txt small">Robot 1</text>
<text x="1265" y="130" class="txt med">System Health</text>
<text x="1265" y="180" class="txt small">Performance</text><circle cx="1540" cy="172" r="10" class="good"/>
<text x="1265" y="235" class="txt small">Calibration Details</text><circle cx="1540" cy="227" r="10" class="good"/>
<text x="1265" y="290" class="txt small">Centroid Connectivity</text><circle cx="1540" cy="282" r="10" class="good"/>
<text x="1265" y="345" class="txt small">Image Error</text><circle cx="1540" cy="337" r="10" class="warn"/>
<text x="1265" y="405" class="txt small">Use this panel to decide</text>
<text x="1265" y="440" class="txt small">whether tracking quality is</text>
<text x="1265" y="475" class="txt small">credible before robot motion.</text>
<circle cx="70" cy="175" r="24" class="call"/><text x="62" y="185" class="num">1</text><path d="M94 175 L390 175" class="line"/>
<circle cx="70" cy="245" r="24" class="call"/><text x="62" y="255" class="num">2</text><path d="M94 245 L390 245" class="line"/>
<circle cx="70" cy="315" r="24" class="call"/><text x="62" y="325" class="num">3</text><path d="M94 315 L390 315" class="line"/>
<circle cx="70" cy="455" r="24" class="call"/><text x="62" y="465" class="num">4</text><path d="M94 455 L390 455" class="line"/>
<circle cx="1180" cy="490" r="24" class="call"/><text x="1172" y="500" class="num">5</text><path d="M1156 490 L880 490" class="line"/>
<circle cx="1285" cy="600" r="24" class="call"/><text x="1277" y="610" class="num">6</text><path d="M1309 600 L1460 420" class="line"/>
<text x="40" y="850" class="txt small">1 camera/system health • 2 calibration • 3 rigid bodies • 4 DataStream clients • 5 verify object identity • 6 confirm health before motion</text>
</svg>