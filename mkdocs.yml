site_name: Sphero + Vicon Swarm Control
site_description: Public toolkit for Vicon-referenced Sphero chariot control
site_url: https://rv-crtl.github.io/sphero-vicon-swarm/
repo_name: sphero-vicon-swarm
repo_url: https://github.com/RV-crtl/sphero-vicon-swarm

theme:
  name: material
  logo: assets/site/logo.svg
  favicon: assets/site/logo.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.12.0/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Get started:
      - End-to-end first run: end-to-end-tutorial.md
      - Getting started: getting-started.md
      - Configuration: configuration.md
      - Hardware setup: hardware-setup.md
  - Vicon:
      - Full setup workflow: vicon-setup.md
      - Tracker visual guide: vicon-tracker-ui-guide.md
      - DataStream SDK: vicon-datastream.md
      - Operator quick checklist: vicon-operator-checklist.md
      - Procedure sources & versions: vicon-procedure-sources.md
  - Engineering:
      - Architecture: architecture.md
      - Control design: control-design.md
      - Validation: validation.md
      - Troubleshooting: troubleshooting.md
      - Safety: safety.md
  - Project:
      - Development history: development-history.md
      - GitHub workflow: github-workflow.md
      - Maintainer workflow: maintainer-workflow.md
      - v1.0.0 release: releases/v1.0.0.md
  - Design decisions:
      - Vicon as navigation truth: adr/0001-vicon-as-navigation-truth.md
      - Per-robot heading calibration: adr/0002-per-robot-calibration.md
      - Fixed PID is not the default: adr/0003-fixed-pid-not-default.md
