site_name: Sphero + Vicon Swarm Control
site_description: Public toolkit for Vicon-referenced Sphero chariot control
repo_name: sphero-vicon-swarm
repo_url: https://github.com/RV-crtl/sphero-vicon-swarm

theme:
  name: material
  logo: assets/site/logo.svg
  favicon: assets/site/logo.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Control design: control-design.md
  - Development history: development-history.md
  - Hardware setup: hardware-setup.md
  - Vicon:
      - Start here — full setup: vicon-setup.md
      - Tracker visual guide: vicon-tracker-ui-guide.md
      - DataStream SDK setup: vicon-datastream.md
      - Operator quick checklist: vicon-operator-checklist.md
      - Procedure sources & versions: vicon-procedure-sources.md
  - Safety: safety.md
  - Troubleshooting: troubleshooting.md
  - Validation: validation.md
  - GitHub workflow: github-workflow.md
  - Design decisions:
      - Vicon as navigation truth: adr/0001-vicon-as-navigation-truth.md
      - Per-robot heading calibration: adr/0002-per-robot-calibration.md
      - Fixed PID is not the default: adr/0003-fixed-pid-not-default.md
  - Maintainer Workflow: maintainer-workflow.md
  - Releases:
      - v1.0.0: releases/v1.0.0.md
